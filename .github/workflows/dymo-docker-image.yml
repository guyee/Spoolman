name: Build DYMO Docker Image

on:
  push:
    branches:
      - dymo-label-printing
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/guyee/spoolman-dymo
  SPOOLMAN_VERSION: 0.23.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4.0.3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Lint client
        run: npm --prefix client run lint

      - name: Check client formatting
        run: npm --prefix client run format-check

      - name: Build client
        run: |
          rm -f client/.env
          printf 'VITE_APIURL=/api/v1\n' > client/.env.production
          npm --prefix client run build

      - name: Set image metadata
        id: vars
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "git_commit=${short_sha}-dymo" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SPOOLMAN_VERSION }}-dymo
            ${{ env.IMAGE_NAME }}:${{ env.SPOOLMAN_VERSION }}-dymo-${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:dymo-label-printing
          labels: |
            org.opencontainers.image.source=https://github.com/guyee/Spoolman
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.SPOOLMAN_VERSION }}-dymo
            org.opencontainers.image.description=Spoolman 0.23.1 with local DYMO helper label printing
          build-args: |
            GIT_COMMIT=${{ steps.vars.outputs.git_commit }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
